[project]
name = "plasma-perf"
version = "0.1.0"
description = "Benchmarking, tuning, and visualization toolkit for PLASMA tile QR (dgeqrf) and its DSSRFB/DTSMQR kernel"
readme = "README.md"
requires-python = ">=3.8"
# 計測コア（core / benchmarks）は Python 標準ライブラリのみで動作する。
dependencies = []

[project.optional-dependencies]
# チューニング（Optuna）。study の可視化に plotly + kaleido を使う。
tuning = [
    "optuna>=4.3.0",
    "plotly>=6.0.1",
    "kaleido==0.2.1",
]
# 結果の可視化（ヒートマップ等）。
viz = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]

[project.scripts]
plasma-perf = "plasma_perf.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
